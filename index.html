<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>newsPortal - नेपालका ताजा र निष्पक्ष समाचार | Nepal Breaking News</title>
    <link rel="canonical" href="https://arjunpokhrel999.github.io/newsPortal/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="top-bar">
            <span id="date">आजको मिति</span>
        </div>
        <div class="logo-container">
            <h1>डिजिटल<span>खबर</span></h1>
        </div>
        <nav>
            <ul id="categoryMenu">
                <li><a href="#" data-category="सबै" class="active">गृहपृष्ठ</a></li>
                <li><a href="#" data-category="अर्थतन्त्र">अर्थतन्त्र</a></li>
                <li><a href="#" data-category="खेलकुद">खेलकुद</a></li>
                <li><a href="#" data-category="प्रविधि">प्रविधि</a></li>
                <li><a href="#" data-category="विश्व">विश्व</a></li>
            </ul>
        </nav>
    </header>

    <section class="ticker-container" aria-label="मुख्य खबर">
        <div class="ticker-title">मुख्य खबर</div>
        <div class="ticker-text">
            <marquee behavior="scroll" direction="left">newsPortal मा स्वागत छ! नेपाल तथा विश्वभरका ताजा र निष्पक्ष समाचारका लागि हामीलाई पछ्याउँदै गर्नुहोस्।</marquee>
        </div>
    </section>

    <main class="container">
        <section class="news-grid" id="newsGrid">
            <!-- JavaScript ले news.json बाट ल्याएर हाल्छ -->
        </section>
    </main>

    <!-- Modal Box: पुरा समाचार पढ्नका लागि -->
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <span id="modalCategory" class="category"></span>
            <span id="modalDate" class="modal-date"></span>
            <h2 id="modalTitle"></h2>
            <img id="modalImg" src="" alt="">
            <p id="modalBody"></p>
        </div>
    </div>

    <footer>
        <p>&copy; २०२६ newsPortal. सर्वाधिकार सुरक्षित।</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
